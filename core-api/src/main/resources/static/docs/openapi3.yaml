openapi: 3.0.1
info:
  title: E-Commerce API
  description: E-Commerce API Documentation
  version: 1.0.0
servers:
- url: http://localhost:8082/
tags: []
paths:
  /api/v1/accounts/me:
    get:
      tags:
      - Account
      summary: 내 계정 정보 조회
      description: 내 계정 정보 조회 API
      operationId: 내 계정 정보 조회 - 성공
      parameters:
      - name: Authorization
        in: header
        description: "인증 토큰 Bearer {access-token}"
        required: true
        schema:
          type: string
        example: Bearer thisismocktoken
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<AccountInfo>'
              examples:
                내 계정 정보 조회 - 성공:
                  value: "{\r\n  \"result\" : \"SUCCESS\",\r\n  \"status\" : 200,\r\
                    \n  \"data\" : {\r\n    \"id\" : 1,\r\n    \"email\" : \"test@ecommerce.com\"\
                    ,\r\n    \"name\" : \"testUser\"\r\n  },\r\n  \"error\" : null,\r\
                    \n  \"timestamp\" : \"2025-11-24T07:40:44.262945700Z\"\r\n}"
  /api/v1/accounts/signup:
    post:
      tags:
      - Account
      summary: 회원가입
      description: 회원가입 API
      operationId: '회원가입 - '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              회원가입 - 성공:
                value: "{\r\n  \"email\" : \"test@test.com\",\r\n  \"password\" :\
                  \ \"test1234\",\r\n  \"name\" : \"testUser\"\r\n}"
              회원가입 - 실패 - 이미 사용 중인 이메일:
                value: "{\r\n  \"email\" : \"existsEmail@ecommerce.com\",\r\n  \"\
                  password\" : \"password1234\",\r\n  \"name\" : \"testUser\"\r\n}"
              회원가입 - 실패 - 잘못된 입력값:
                value: "{\r\n  \"email\" : \"invalid-email-format\",\r\n  \"password\"\
                  \ : \"password1234\",\r\n  \"name\" : \"testUser\"\r\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<SignupResult>'
              examples:
                회원가입 - 성공:
                  value: "{\r\n  \"result\" : \"SUCCESS\",\r\n  \"status\" : 200,\r\
                    \n  \"data\" : {\r\n    \"email\" : \"test@test.com\",\r\n   \
                    \ \"name\" : \"testUser\"\r\n  },\r\n  \"error\" : null,\r\n \
                    \ \"timestamp\" : \"2025-11-24T07:40:45.303944600Z\"\r\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<Unit>'
              examples:
                회원가입 - 실패 - 이미 사용 중인 이메일:
                  value: "{\r\n  \"result\" : \"ERROR\",\r\n  \"status\" : 400,\r\n\
                    \  \"data\" : null,\r\n  \"error\" : {\r\n    \"message\" : \"\
                    이미 사용 중인 이메일입니다.\",\r\n    \"data\" : null\r\n  },\r\n  \"timestamp\"\
                    \ : \"2025-11-24T07:40:45.252941800Z\"\r\n}"
                회원가입 - 실패 - 잘못된 입력값:
                  value: "{\r\n  \"result\" : \"ERROR\",\r\n  \"status\" : 400,\r\n\
                    \  \"data\" : null,\r\n  \"error\" : {\r\n    \"message\" : \"\
                    입력 값이 유효하지 않습니다.\",\r\n    \"data\" : null\r\n  },\r\n  \"timestamp\"\
                    \ : \"2025-11-24T07:40:45.195942400Z\"\r\n}"
components:
  schemas:
    ApiResponse<SignupResult>:
      title: ApiResponse<SignupResult>
      required:
      - data
      - error
      - result
      - status
      - timestamp
      type: object
      properties:
        result:
          type: string
          description: 요청 결과 (SUCCESS/ERROR)
        data:
          required:
          - email
          - name
          type: object
          properties:
            name:
              type: string
              description: 계정 이름
            email:
              type: string
              description: 계정 이메일
          description: 응답 데이터
        timestamp:
          type: string
          description: 응답 생성 시간
        status:
          type: number
          description: HTTP 상태 코드
    ApiResponse<Unit>:
      title: ApiResponse<Unit>
      required:
      - data
      - error
      - result
      - status
      - timestamp
      type: object
      properties:
        result:
          type: string
          description: 요청 결과 (SUCCESS/ERROR)
        error:
          required:
          - message
          type: object
          properties:
            message:
              type: string
              description: 오류 메시지
          description: 오류 정보
        timestamp:
          type: string
          description: 응답 생성 시간
        status:
          type: number
          description: HTTP 상태 코드
    ApiResponse<AccountInfo>:
      title: ApiResponse<AccountInfo>
      required:
      - data
      - error
      - result
      - status
      - timestamp
      type: object
      properties:
        result:
          type: string
          description: 요청 결과 (SUCCESS/ERROR)
        data:
          required:
          - email
          - id
          - name
          type: object
          properties:
            name:
              type: string
              description: 계정 이름
            id:
              type: number
              description: 계정 고유 아이디
            email:
              type: string
              description: 계정 이메일
          description: 응답 데이터
        timestamp:
          type: string
          description: 응답 생성 시간
        status:
          type: number
          description: HTTP 상태 코드
    SignupRequest:
      title: SignupRequest
      required:
      - email
      - name
      - password
      type: object
      properties:
        password:
          type: string
          description: 계정 비밀번호
        name:
          type: string
          description: 계정 이름
        email:
          type: string
          description: 계정 이메일
