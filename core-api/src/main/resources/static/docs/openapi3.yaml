openapi: 3.0.1
info:
  title: E-Commerce API
  description: E-Commerce API Documentation
  version: 1.0.0
servers:
- url: http://localhost:8082/
tags: []
paths:
  /api/v1/orders:
    post:
      tags:
      - Order
      summary: 주문 등록
      description: 주문 등록 API
      operationId: 주문 등록 - 성공
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              주문 등록 - 성공:
                value: "{\n  \"productId\" : 1,\n  \"quantity\" : 1\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<CreateOrderResult>'
              examples:
                주문 등록 - 성공:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"status\" : 200,\n  \"\
                    data\" : {\n    \"orderKey\" : \"20260117153212345\"\n  },\n \
                    \ \"error\" : null,\n  \"timestamp\" : \"2026-02-17T13:04:53.592462Z\"\
                    \n}"
  /api/v1/products:
    post:
      tags:
      - Product
      summary: 상품 등록
      description: 상품 등록 API
      operationId: 상품 등록 - 성공
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            examples:
              상품 등록 - 성공:
                value: "{\n  \"name\" : \"테스트 상품\",\n  \"description\" : \"테스트 상품\
                  \ 설명\",\n  \"costPrice\" : 1000,\n  \"salesPrice\" : 1500\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<CreateProductResult>'
              examples:
                상품 등록 - 성공:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"status\" : 200,\n  \"\
                    data\" : {\n    \"productId\" : 1,\n    \"name\" : \"테스트 상품\"\
                    ,\n    \"description\" : \"테스트 상품 설명\",\n    \"costPrice\" : 1000,\n\
                    \    \"salesPrice\" : 1500,\n    \"status\" : \"ACTIVE\"\n  },\n\
                    \  \"error\" : null,\n  \"timestamp\" : \"2026-02-17T13:04:53.638005Z\"\
                    \n}"
  /api/v1/accounts/me:
    get:
      tags:
      - Account
      summary: 내 계정 정보 조회
      description: 내 계정 정보 조회 API
      operationId: 내 계정 정보 조회 - 성공
      parameters:
      - name: Authorization
        in: header
        description: "인증 토큰 Bearer {access-token}"
        required: true
        schema:
          type: string
        example: "Bearer {access-token}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<AccountInfo>'
              examples:
                내 계정 정보 조회 - 성공:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"status\" : 200,\n  \"\
                    data\" : {\n    \"id\" : 1,\n    \"email\" : \"test@ecommerce.com\"\
                    ,\n    \"name\" : \"testUser\"\n  },\n  \"error\" : null,\n  \"\
                    timestamp\" : \"2026-02-17T13:04:53.225781Z\"\n}"
  /api/v1/accounts/signup:
    post:
      tags:
      - Account
      summary: 회원가입
      description: 회원가입 API
      operationId: '회원가입 - '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              회원가입 - 실패 - 이미 사용 중인 이메일:
                value: "{\n  \"email\" : \"existsEmail@ecommerce.com\",\n  \"password\"\
                  \ : \"password1234\",\n  \"name\" : \"testUser\"\n}"
              회원가입 - 성공:
                value: "{\n  \"email\" : \"test@test.com\",\n  \"password\" : \"test1234\"\
                  ,\n  \"name\" : \"testUser\"\n}"
              회원가입 - 실패 - 잘못된 입력값:
                value: "{\n  \"email\" : \"invalid-email-format\",\n  \"password\"\
                  \ : \"password1234\",\n  \"name\" : \"testUser\"\n}"
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<Unit>'
              examples:
                회원가입 - 실패 - 이미 사용 중인 이메일:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"status\" : 400,\n  \"\
                    data\" : null,\n  \"error\" : {\n    \"message\" : \"이미 사용 중인\
                    \ 이메일입니다.\",\n    \"data\" : null\n  },\n  \"timestamp\" : \"\
                    2026-02-17T13:04:53.462026Z\"\n}"
                회원가입 - 실패 - 잘못된 입력값:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"status\" : 400,\n  \"\
                    data\" : null,\n  \"error\" : {\n    \"message\" : \"입력 값이 유효하\
                    지 않습니다.\",\n    \"data\" : null\n  },\n  \"timestamp\" : \"2026-02-17T13:04:53.446596Z\"\
                    \n}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<SignupResult>'
              examples:
                회원가입 - 성공:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"status\" : 200,\n  \"\
                    data\" : {\n    \"email\" : \"test@test.com\",\n    \"name\" :\
                    \ \"testUser\"\n  },\n  \"error\" : null,\n  \"timestamp\" : \"\
                    2026-02-17T13:04:53.474528Z\"\n}"
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 로그인
      description: 로그인 API
      operationId: '로그인 - '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              로그인 - 실패 - 비밀번호 불일치:
                value: "{\n  \"email\" : \"test@ecommerce.com\",\n  \"password\" :\
                  \ \"testpassword\"\n}"
              로그인 - 실패 - 존재하지 않는 계정:
                value: "{\n  \"email\" : \"test@ecommerce.com\",\n  \"password\" :\
                  \ \"testpassword\"\n}"
              로그인 - 성공:
                value: "{\n  \"email\" : \"test@ecommerce.com\",\n  \"password\" :\
                  \ \"testpassword\"\n}"
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<Unit>'
              examples:
                로그인 - 실패 - 비밀번호 불일치:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"status\" : 400,\n  \"\
                    data\" : null,\n  \"error\" : {\n    \"message\" : \"비밀번호가 일치하\
                    지 않습니다.\",\n    \"data\" : null\n  },\n  \"timestamp\" : \"2026-02-17T13:04:53.538524Z\"\
                    \n}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<Unit>'
              examples:
                로그인 - 실패 - 존재하지 않는 계정:
                  value: "{\n  \"result\" : \"ERROR\",\n  \"status\" : 404,\n  \"\
                    data\" : null,\n  \"error\" : {\n    \"message\" : \"존재하지 않는 계\
                    정입니다.\",\n    \"data\" : null\n  },\n  \"timestamp\" : \"2026-02-17T13:04:53.550979Z\"\
                    \n}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse<LoginResult>'
              examples:
                로그인 - 성공:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"status\" : 200,\n  \"\
                    data\" : {\n    \"id\" : 1,\n    \"email\" : \"test@ecommerce.com\"\
                    ,\n    \"name\" : \"testUser\",\n    \"accessToken\" : \"thisistesttoken\"\
                    \n  },\n  \"error\" : null,\n  \"timestamp\" : \"2026-02-17T13:04:53.523965Z\"\
                    \n}"
components:
  schemas:
    ApiResponse<CreateOrderResult>:
      title: ApiResponse<CreateOrderResult>
      required:
      - data
      - error
      - result
      - status
      - timestamp
      type: object
      properties:
        result:
          type: string
          description: 요청 결과 (SUCCESS/ERROR)
        data:
          required:
          - orderKey
          type: object
          properties:
            orderKey:
              type: string
              description: 주문키
          description: 응답 데이터
        timestamp:
          type: string
          description: 응답 생성 시간
        status:
          type: number
          description: HTTP 상태 코드
    LoginRequest:
      title: LoginRequest
      required:
      - email
      - password
      type: object
      properties:
        password:
          type: string
          description: 계정 비밀번호
        email:
          type: string
          description: 계정 이메일
    ApiResponse<SignupResult>:
      title: ApiResponse<SignupResult>
      required:
      - data
      - error
      - result
      - status
      - timestamp
      type: object
      properties:
        result:
          type: string
          description: 요청 결과 (SUCCESS/ERROR)
        data:
          required:
          - email
          - name
          type: object
          properties:
            name:
              type: string
              description: 계정 이름
            email:
              type: string
              description: 계정 이메일
          description: 응답 데이터
        timestamp:
          type: string
          description: 응답 생성 시간
        status:
          type: number
          description: HTTP 상태 코드
    ApiResponse<AccountInfo>:
      title: ApiResponse<AccountInfo>
      required:
      - data
      - error
      - result
      - status
      - timestamp
      type: object
      properties:
        result:
          type: string
          description: 요청 결과 (SUCCESS/ERROR)
        data:
          required:
          - email
          - id
          - name
          type: object
          properties:
            name:
              type: string
              description: 계정 이름
            id:
              type: number
              description: 계정 고유 아이디
            email:
              type: string
              description: 계정 이메일
          description: 응답 데이터
        timestamp:
          type: string
          description: 응답 생성 시간
        status:
          type: number
          description: HTTP 상태 코드
    ApiResponse<Unit>:
      title: ApiResponse<Unit>
      required:
      - data
      - error
      - result
      - status
      - timestamp
      type: object
      properties:
        result:
          type: string
          description: 요청 결과 (SUCCESS/ERROR)
        error:
          required:
          - message
          type: object
          properties:
            message:
              type: string
              description: 오류 메시지
          description: 오류 정보
        timestamp:
          type: string
          description: 응답 생성 시간
        status:
          type: number
          description: HTTP 상태 코드
    CreateProductRequest:
      title: CreateProductRequest
      required:
      - costPrice
      - description
      - name
      - salesPrice
      type: object
      properties:
        salesPrice:
          type: number
          description: 판매가
        costPrice:
          type: number
          description: 원가
        name:
          type: string
          description: 상품 이름
        description:
          type: string
          description: 상품 설명
    ApiResponse<LoginResult>:
      title: ApiResponse<LoginResult>
      required:
      - data
      - error
      - result
      - status
      - timestamp
      type: object
      properties:
        result:
          type: string
          description: 요청 결과 (SUCCESS/ERROR)
        data:
          required:
          - accessToken
          - email
          - id
          - name
          type: object
          properties:
            name:
              type: string
              description: 계정 이름
            id:
              type: number
              description: 계정 고유 아이디
            accessToken:
              type: string
              description: 엑세스 토큰
            email:
              type: string
              description: 계정 이메일
          description: 응답 데이터
        timestamp:
          type: string
          description: 응답 생성 시간
        status:
          type: number
          description: HTTP 상태 코드
    CreateOrderRequest:
      title: CreateOrderRequest
      required:
      - productId
      - quantity
      type: object
      properties:
        quantity:
          type: number
          description: 상품 수량
        productId:
          type: number
          description: 상품 ID
    ApiResponse<CreateProductResult>:
      title: ApiResponse<CreateProductResult>
      required:
      - data
      - error
      - result
      - status
      - timestamp
      type: object
      properties:
        result:
          type: string
          description: 요청 결과 (SUCCESS/ERROR)
        data:
          required:
          - costPrice
          - description
          - name
          - productId
          - salesPrice
          - status
          type: object
          properties:
            productId:
              type: number
              description: 상품 ID
            salesPrice:
              type: number
              description: 판매가
            costPrice:
              type: number
              description: 원가
            name:
              type: string
              description: 상품 이름
            description:
              type: string
              description: 상품 설명
            status:
              type: string
              description: 상품 상태
          description: 응답 데이터
        timestamp:
          type: string
          description: 응답 생성 시간
        status:
          type: number
          description: HTTP 상태 코드
    SignupRequest:
      title: SignupRequest
      required:
      - email
      - name
      - password
      type: object
      properties:
        password:
          type: string
          description: 계정 비밀번호
        name:
          type: string
          description: 계정 이름
        email:
          type: string
          description: 계정 이메일
